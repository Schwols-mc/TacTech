name: Android APK

# main'e her yüklemede APK derlenir ve "Releases" sayfasına konur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web dosyalarını hazırla
        run: |
          npm ci
          npm run www
          npx cap sync android

      - name: İmza anahtarını yerleştir
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::ANDROID_KEYSTORE_B64 secret eksik"; exit 1; fi
          echo "$KS_B64" | base64 -d > android/app/tactech.keystore

      - name: APK derle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../TacTech_AndTab.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.${{ github.run_number }}
          name: TacTech 0.5.${{ github.run_number }}
          body: Tablete indirip kurun. Önceki sürümün üzerine güncelleme olarak kurulur.
          files: TacTech_AndTab.apk
          make_latest: true

  # Windows kurulum dosyası: APK ile aynı sürüme eklenir.
  # Bu adım başarısız olsa bile APK yayınlanmış olur.
  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uygulama dosyalarını hazırla
        run: |
          npm ci
          npm run app

      - name: Electron paketini derle
        run: |
          npx electron-builder --win --x64 --dir
          node seticon.js

      - name: Kurulum dosyasını derle
        run: |
          MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$MAKENSIS" ]; then choco install nsis -y --no-progress; fi
          "$MAKENSIS" //INPUTCHARSET UTF8 installer.nsi

      - name: Sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.${{ github.run_number }}
          files: windows/dist/TacTech_win.exe
