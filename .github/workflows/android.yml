name: Android APK

# main'e her yüklemede APK derlenir ve "Releases" sayfasına konur.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarasını oku (VERSION dosyası)
        shell: bash
        run: echo "APP_VERSION=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web dosyalarını hazırla
        run: |
          npm ci
          npm run www
          npx cap sync android

      - name: İmza anahtarını yerleştir
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::ANDROID_KEYSTORE_B64 secret eksik"; exit 1; fi
          echo "$KS_B64" | base64 -d > android/app/tactech.keystore

      - name: APK derle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../TacTech_AndTab.apk

      - name: Sürüm olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: TacTech ${{ env.APP_VERSION }}
          body: Tablete indirip kurun. Önceki sürümün üzerine güncelleme olarak kurulur.
          files: TacTech_AndTab.apk
          make_latest: true

  # Windows kurulum dosyası: APK ile aynı sürüme eklenir.
  # Bu adım başarısız olsa bile APK yayınlanmış olur.
  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - name: Sürüm numarasını oku (VERSION dosyası)
        shell: bash
        working-directory: .
        run: echo "APP_VERSION=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uygulama dosyalarını hazırla
        run: |
          npm ci
          npm run app

      - name: Google giriş bilgilerini yerleştir
        env:
          GID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GSEC: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          if [ -z "$GID" ] || [ -z "$GSEC" ]; then echo "::warning::Google giriş bilgileri (secrets) eksik; Windows'ta Google girişi çalışmaz"; exit 0; fi
          node -e "const f='main.js',fs=require('fs');fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('__G_DESKTOP_CLIENT_ID__',process.env.GID).replace('__G_DESKTOP_CLIENT_SECRET__',process.env.GSEC))"

      - name: Electron paketini derle
        run: |
          npx electron-builder --win --x64 --dir
          node seticon.js

      - name: Kurulum dosyasını derle
        run: |
          MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
          if [ ! -f "$MAKENSIS" ]; then choco install nsis -y --no-progress; fi
          "$MAKENSIS" //INPUTCHARSET UTF8 //DAPP_VERSION="$(echo "$APP_VERSION.0.0.0" | cut -d. -f1-4)" installer.nsi

      - name: Sürüme ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          files: windows/dist/TacTech_win.exe
